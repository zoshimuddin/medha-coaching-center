name: Apply Supabase migrations

# Runs only when SQL migrations change on main, and only if the
# SUPABASE_ACCESS_TOKEN secret is configured (otherwise it skips quietly).
on:
  push:
    branches: [main]
    paths:
      - "supabase/*.sql"

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply changed migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: mlsyvhlnnjexqtaswayi
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret not set — skipping migrations."
            exit 0
          fi
          before="${{ github.event.before }}"
          case "$before" in
            ""|0000000000000000000000000000000000000000) before="HEAD~1";;
          esac
          files="$(git diff --name-only "$before" "${{ github.sha }}" -- 'supabase/*.sql' || true)"
          if [ -z "$files" ]; then
            echo "No SQL changes in this push."
            exit 0
          fi
          for f in $files; do
            bash supabase/apply.sh "$f"
          done
